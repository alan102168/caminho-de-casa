name: Verificar projeto Godot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4

      - name: Instalar Godot 4.4.1
        run: |
          curl --fail --location --retry 3 --output godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64

      - name: Importar e validar recursos e scripts
        run: |
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --import

      - name: Executar teste de missão
        run: |
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/smoke.gd

      - name: Executar cena por 10 quadros
        run: |
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --quit-after 10
